<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Vastra</title><link rel="stylesheet" href="styles.css"></head><body class="auth-page"><main class="otp-card" id="authCard"><a class="brand" href="/">VASTRA</a><section id="loginStep"><h1>Login / Signup</h1><p>Enter your mobile number or email to continue.</p><label>Mobile number or email<input id="loginValue" autocomplete="email tel" placeholder="Enter mobile number or email"></label><button class="btn btn-dark full" id="continueBtn">CONTINUE</button><small>By continuing, you agree to Vastra’s Terms of Use and Privacy Policy.</small></section><section id="otpStep" hidden><div class="otp-icon">✦</div><h1>Verify with OTP</h1><p>Sent to <strong id="sentTo"></strong></p><div class="otp-boxes"><input maxlength="1" autofocus><input maxlength="1"><input maxlength="1"><input maxlength="1"></div><button class="resend" id="resend">RESEND OTP</button><p class="otp-links">Log in using <b>Password</b></p><p class="otp-links">Having trouble logging in? <b>Get help</b></p><button class="btn btn-dark full" id="verifyBtn">VERIFY</button><div id="otpMsg"></div></section><section id="nameStep" hidden><div class="otp-icon">✦</div><h1>Tell us your name</h1><p>Complete your Vastra profile to continue.</p><label>Full name<input id="nameValue" placeholder="Enter your name" autocomplete="name"></label><button class="btn btn-dark full" id="saveName">CONTINUE</button><div id="nameMsg"></div></section></main><script>const value=document.querySelector('#loginValue'),login=document.querySelector('#loginStep'),otp=document.querySelector('#otpStep'),nameStep=document.querySelector('#nameStep'),sent=document.querySelector('#sentTo');continueBtn.onclick=()=>{const v=value.value.trim();if(!v)return value.focus();localStorage.setItem('vastra_login_identifier',v);sent.textContent=v;login.hidden=true;otp.hidden=false;otp.querySelector('input').focus()};document.querySelectorAll('.otp-boxes input').forEach((x,i,a)=>x.oninput=()=>{if(x.value&&a[i+1])a[i+1].focus()});resend.onclick=()=>{otpMsg.textContent='A new OTP has been sent.'};verifyBtn.onclick=()=>{const code=[...document.querySelectorAll('.otp-boxes input')].map(x=>x.value).join('');if(code.length!==4){otpMsg.textContent='Enter the 4-digit OTP.';return}const id=localStorage.getItem('vastra_login_identifier')||'';const old=JSON.parse(localStorage.getItem('vastra_profile')||'{}');if(old.email===id&&old.name){localStorage.setItem('vastra_authenticated','true');location.href='/';return}otp.hidden=true;nameStep.hidden=false;nameValue.focus()};saveName.onclick=()=>{const n=nameValue.value.trim();if(!n)return nameValue.focus();const id=localStorage.getItem('vastra_login_identifier')||'';localStorage.setItem('vastra_profile',JSON.stringify({name:n,email:id}));localStorage.setItem('vastra_authenticated','true');location.href='/'};</script></body></html>

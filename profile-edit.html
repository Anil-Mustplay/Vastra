<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Profile | Vastra</title><link rel="stylesheet" href="styles.css"></head><body class="profile-page"><header class="site-header"><a class="brand" href="/">VASTRA</a><a class="text-link" href="/profile">← Profile details</a></header><main class="profile-edit-page"><section class="profile-details"><h1>Edit Profile</h1><form id="editProfileForm" class="profile-edit-form"><label>Full Name<input name="name" required></label><label>Email ID <em class="verified-badge" id="emailVerified" hidden>✓ Verified</em><input name="email" type="email"></label><label>Gender<select name="gender"><option value="">Select</option><option>MALE</option><option>FEMALE</option><option>OTHER</option></select></label><label>Date of Birth<input name="dob" placeholder="DD-MM-YYYY" maxlength="10" pattern="\d{2}-\d{2}-\d{4}"></label><label>Location <span class="optional">Optional</span><div class="location-row"><input name="location" placeholder="City, State"><button type="button" id="gpsButton" aria-label="Use GPS" title="Use GPS">⌖</button></div></label><label>Mobile Number <em class="verified-badge" id="mobileVerified" hidden>✓ Verified</em><input name="alternate" type="tel" placeholder="Enter mobile number"></label><label>Hint Name<input name="hint"></label><div><button type="button" class="edit-action" id="cancelEdit">Cancel</button><button class="btn btn-dark edit-action">Save</button></div><p id="editMessage"></p></form></section></main><script>const saved=JSON.parse(localStorage.getItem('vastra_profile')||'{}'),form=document.querySelector('#editProfileForm'),identifier=(localStorage.getItem('vastra_login_identifier')||'').trim(),isLogged=localStorage.getItem('vastra_authenticated')==='true';Object.entries(saved).forEach(([k,v])=>{if(form.elements[k])form.elements[k].value=v});const verified=isLogged&&identifier&&(saved.email===identifier||saved.mobile===identifier||saved.alternate===identifier);if(verified&&identifier.includes('@')){emailVerified.hidden=false;form.elements.email.value=identifier}else if(verified){mobileVerified.hidden=false;form.elements.alternate.value=identifier}form.onsubmit=e=>{e.preventDefault();if(form.elements.dob.value&&!/^\d{2}-\d{2}-\d{4}$/.test(form.elements.dob.value)){editMessage.textContent='Use DD-MM-YYYY format.';return}const data=Object.fromEntries(new FormData(form));localStorage.setItem('vastra_profile',JSON.stringify({...saved,...data}));location.href='/profile'};cancelEdit.onclick=()=>location.href='/profile';gpsButton.onclick=()=>{if(!navigator.geolocation){editMessage.textContent='GPS is not supported.';return}navigator.geolocation.getCurrentPosition(pos=>{form.elements.location.value=pos.coords.latitude.toFixed(5)+', '+pos.coords.longitude.toFixed(5)},()=>editMessage.textContent='Location permission was not granted.')}</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vastra Product</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="/">VASTRA</a><a class="text-link" href="/#shop">← Back to collection</a></header><main id="productPage" class="product-page"><p>Loading product…</p></main><script>const esc=x=>String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const sku=new URLSearchParams(location.search).get('sku');fetch('/api/products').then(r=>r.json()).then(rows=>{const p=rows.find(x=>x.sku===sku)||rows[0];if(!p)return;const sold=Number(p.stock)<=0;productPage.innerHTML='<div class="product-detail"><div class="product-detail-art" style="--p:#8c3038;--q:#d4a461"></div><div class="product-detail-copy"><p class="eyebrow">VASTRA · '+esc(p.category||'COLLECTION')+'</p><h1>'+esc(p.name)+'</h1><div class="detail-price">₹'+Number(p.price).toLocaleString('en-IN')+' <del>₹'+Number(p.mrp||p.price).toLocaleString('en-IN')+'</del></div><p class="detail-description">A considered piece made for celebration and everyday ritual. Finished with thoughtful detail and the unmistakable character of Indian craft.</p><div class="detail-info"><span>SKU <b>'+esc(p.sku)+'</b></span><span>Dispatch <b>Within 2–3 days</b></span></div><p class="stock-status">'+(sold?'Out of stock':'In stock · Ready to ship')+'</p><button class="btn btn-dark full" '+(sold?'disabled':'')+' id="addProduct">'+(sold?'Out of stock':'Add to bag →')+'</button><div class="detail-accordions"><details open><summary>Product details</summary><p>Premium Indian ethnic fashion, designed with care and made to be worn, loved and remembered.</p></details><details><summary>Shipping & returns</summary><p>Dispatch within 2–3 days. Easy 7-day returns.</p></details></div></div></div>';if(!sold)addProduct.onclick=()=>{const cart=JSON.parse(localStorage.getItem('vastra-cart')||'[]');const item=cart.find(x=>x.id===p.id);if(item)item.qty++;else cart.push({id:p.id,qty:1});localStorage.setItem('vastra-cart',JSON.stringify(cart));addProduct.textContent='Added to bag ✓'}})</script></body></html>

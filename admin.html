const URL='https://trnzlkcdjjltphkknrqv.supabase.co/rest/v1/',KEY='sb_publishable_NaR11hPva6us_0wX2fNamA_PWJ_YFR8',H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation'},esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),get=async(path,opts={})=>{const r=await fetch(URL+path,{...opts,headers:{...H,...(opts.headers||{})}});if(!r.ok)throw Error(await r.text());return r.json()},content=document.querySelector('#adminContent');
function shell(k,t,b){content.innerHTML='<div class="admin-top"><div><p class="eyebrow">'+k+'</p><h1>'+t+'</h1></div></div>'+b}
async function dashboard(){try{const [p,o]=await Promise.all([get('products?select=*'),get('orders?select=*')]);shell('OVERVIEW','Dashboard','<div class="metrics"><div class="metric"><span>Products</span><strong>'+p.length+'</strong></div><div class="metric"><span>Orders</span><strong>'+o.length+'</strong></div><div class="metric"><span>Sales</span><strong>₹'+o.reduce((s,x)=>s+Number(x.total||0),0).toLocaleString('en-IN')+'</strong></div><div class="metric"><span>Low stock</span><strong>'+p.filter(x=>Number(x.stock)<10).length+'</strong></div></div>')}catch(e){shell('OVERVIEW','Dashboard','<section class="admin-panel"><h2>Data unavailable</h2><p>'+esc(e.message)+'</p></section>')}}
function form(p){const x=p||{name:'',sku:'',category:'Sarees',price:0,mrp:0,stock:0,status:'active',description:''};shell('CATALOG',p?'Edit product':'Add product','<section class="admin-panel"><form id="productForm" class="edit-form"><label>Product name<input name="name" required value="'+esc(x.name)+'"></label><label>SKU<input name="sku" '+(p?'readonly':'required')+' value="'+esc(x.sku)+'"></label><label>Category<input name="category" required value="'+esc(x.category)+'"></label><label>Price<input name="price" required type="number" min="0" value="'+Number(x.price||0)+'"></label><label>MRP<input name="mrp" required type="number" min="0" value="'+Number(x.mrp||0)+'"></label><label>Stock<input name="stock" required type="number" min="0" value="'+Number(x.stock||0)+'"></label><label>Status<select name="status"><option value="active" '+(x.status!=='disabled'?'selected':'')+'>Visible / Active</option><option value="disabled" '+(x.status==='disabled'?'selected':'')+'>Disabled / Hidden</option></select></label><label>Description<textarea name="description">'+esc(x.description)+'</textarea></label><div><button type="button" id="cancelEdit">Cancel</button> <button class="btn btn-dark" type="submit">Save</button><span id="msg"></span></div></form></section>');cancelEdit.onclick=products;productForm.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));['price','mrp','stock'].forEach(k=>data[k]=Number(data[k]||0));try{await get(p?'products?sku=eq.'+encodeURIComponent(p.sku):'products',{method:p?'PATCH':'POST',body:JSON.stringify(data)});msg.textContent=' Saved successfully';setTimeout(products,500)}catch(err){msg.textContent=' Save failed: '+err.message}}}
async function products(){try{const p=await get('products?select=*&order=created_at.desc');shell('CATALOG','Products','<section class="admin-panel"><div class="panel-head"><h2>All products</h2><div><input id="q" placeholder="Search products"> <button id="addProduct" class="btn btn-dark">+ Add product</button></div></div><table><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows">'+p.map((x,i)=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.sku)+'</td><td>₹'+Number(x.price).toLocaleString('en-IN')+'</td><td>'+x.stock+'</td><td>'+esc(x.status)+'</td><td><button data-edit="'+i+'">Edit</button> <button data-toggle="'+i+'">'+(x.status==='disabled'?'Enable':'Disable')+'</button> <button data-delete="'+i+'">Delete</button></td></tr>').join('')+'</tbody></table></section>');addProduct.onclick=()=>form();q.oninput=()=>rows.querySelectorAll('tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q.value.toLowerCase()));rows.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(p[b.dataset.edit]));rows.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const x=p[b.dataset.toggle];await get('products?sku=eq.'+encodeURIComponent(x.sku),{method:'PATCH',body:JSON.stringify({status:x.status==='disabled'?'active':'disabled'})});products()});rows.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const x=p[b.dataset.delete];if(confirm('Delete '+x.name+'?')){await get('products?sku=eq.'+encodeURIComponent(x.sku),{method:'DELETE'});products()}})}catch(e){shell('CATALOG','Products','<section class="admin-panel"><h2>Unable to load products</h2><p>'+esc(e.message)+'</p></section>')}}
async function orders(){try{const o=await get('orders?select=*&order=created_at.desc');shell('FULFILMENT','Orders','<section class="admin-panel"><h2>Live orders</h2><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>'+o.map(x=>'<tr><td>'+esc(x.order_number||x.id)+'</td><td>'+esc(x.shipping_address?.name||'Guest')+'</td><td>₹'+Number(x.total||0).toLocaleString('en-IN')+'</td><td>'+esc(x.status)+'</td></tr>').join('')+'</tbody></table></section>')}catch(e){shell('FULFILMENT','Orders','<section class="admin-panel"><h2>Unable to load orders</h2><p>'+esc(e.message)+'</p></section>')}}
const baseForm=form;form=function(p){baseForm(p);const f=document.querySelector('#productForm');if(!f)return;const wrap=document.createElement('label');wrap.innerHTML='Product images <input id="productImages" type="file" accept="image/*" multiple><small id="uploadStatus">Select multiple images; they upload to Supabase Storage.</small><div id="imagePreview"></div>';f.querySelector('[name="description"]').parentElement.before(wrap);['image_url','image_urls'].forEach(n=>{const i=document.createElement('input');i.type='hidden';i.name=n;i.value=p?.[n]||'';f.appendChild(i)});const input=wrap.querySelector('#productImages'),status=wrap.querySelector('#uploadStatus'),preview=wrap.querySelector('#imagePreview');input.onchange=async()=>{const files=[...input.files||[]];if(!files.length)return;const sku=f.elements.sku.value.trim()||'new-product';const urls=[];status.textContent='Uploading '+files.length+' image(s)…';for(const file of files){const path=encodeURIComponent(sku+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'-'));const r=await fetch('https://trnzlkcdjjltphkknrqv.supabase.co/storage/v1/object/product-images/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':file.type||'application/octet-stream','x-upsert':'true'},body:file});if(!r.ok){status.textContent='Upload failed: '+await r.text();return}urls.push('https://trnzlkcdjjltphkknrqv.supabase.co/storage/v1/object/public/product-images/'+path)}f.elements.image_url.value=urls[0]||'';f.elements.image_urls.value=JSON.stringify(urls);preview.innerHTML=urls.map(u=>'<img src="'+u+'" style="width:72px;height:90px;object-fit:cover;margin:8px 8px 0 0;border:1px solid #ddd">').join('');status.textContent=urls.length+' image(s) uploaded';};};
const slotForm=form;form=function(p){slotForm(p);const f=document.querySelector('#productForm'),old=f?.querySelector('#productImages');if(!f||!old)return;old.closest('label').style.display='none';const box=document.createElement('div');box.className='image-slots';box.innerHTML='<div class="image-slot-grid"></div><button type="button" class="btn image-add">＋ Add image</button>';old.closest('label').before(box);const grid=box.querySelector('.image-slot-grid'),urls=[];const sync=()=>{f.elements.image_url.value=urls[0]||'';f.elements.image_urls.value=JSON.stringify(urls.filter(Boolean))};const addSlot=(value='')=>{const slot=document.createElement('div');slot.className='image-slot';slot.innerHTML='<label class="image-square"><span>＋</span><input type="file" accept="image/*"><img alt=""></label><button type="button" class="image-remove">Remove</button><small class="image-state">Choose image</small>';const input=slot.querySelector('input'),img=slot.querySelector('img'),state=slot.querySelector('.image-state');const index=urls.length;urls.push(value);if(value){img.src=value;slot.classList.add('has-image');state.textContent='Uploaded'}input.onchange=async()=>{const file=input.files?.[0];if(!file)return;const sku=f.elements.sku.value.trim()||'new-product';state.textContent='Uploading…';const path=encodeURIComponent(sku+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'-'));const r=await fetch('https://trnzlkcdjjltphkknrqv.supabase.co/storage/v1/object/product-images/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':file.type||'application/octet-stream','x-upsert':'true'},body:file});if(!r.ok){state.textContent='Upload failed';return}urls[index]='https://trnzlkcdjjltphkknrqv.supabase.co/storage/v1/object/public/product-images/'+path;img.src=urls[index];slot.classList.add('has-image');state.textContent='Uploaded';sync()};slot.querySelector('.image-remove').onclick=()=>{urls[index]=null;slot.remove();sync()};grid.appendChild(slot)};addSlot();box.querySelector('.image-add').onclick=()=>addSlot();sync()};
function route(v){document.querySelectorAll('.admin-nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));v==='products'?products():v==='orders'?orders():dashboard()}document.querySelectorAll('.admin-nav').forEach(x=>x.onclick=()=>{location.hash=x.dataset.view;route(x.dataset.view)});route(location.hash.slice(1)||'dashboard');
</script></body></html>

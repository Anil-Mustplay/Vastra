<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vastra Admin</title><link rel="stylesheet" href="styles.css"></head><body><div class="admin-shell"><aside class="admin-side"><a class="brand" href="/">VASTRA</a><p class="eyebrow">CONTROL CENTRE</p><button class="admin-nav active" data-view="dashboard">Dashboard</button><button class="admin-nav" data-view="products">Products</button><button class="admin-nav" data-view="orders">Orders</button><a href="/">← View storefront</a></aside><main class="admin-main" id="adminContent"></main></div><script>
const URL='https://trnzlkcdjjltphkknrqv.supabase.co/rest/v1/',KEY='sb_publishable_NaR11hPva6us_0wX2fNamA_PWJ_YFR8',H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation'},esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),get=async(path,opts={})=>{const r=await fetch(URL+path,{...opts,headers:{...H,...(opts.headers||{})}});if(!r.ok)throw Error(await r.text());return r.json()},content=document.querySelector('#adminContent');
function shell(k,t,b){content.innerHTML='<div class="admin-top"><div><p class="eyebrow">'+k+'</p><h1>'+t+'</h1></div></div>'+b}
async function dashboard(){try{const [p,o]=await Promise.all([get('products?select=*'),get('orders?select=*')]);shell('OVERVIEW','Dashboard','<div class="metrics"><div class="metric"><span>Products</span><strong>'+p.length+'</strong></div><div class="metric"><span>Orders</span><strong>'+o.length+'</strong></div><div class="metric"><span>Sales</span><strong>₹'+o.reduce((s,x)=>s+Number(x.total||0),0).toLocaleString('en-IN')+'</strong></div><div class="metric"><span>Low stock</span><strong>'+p.filter(x=>Number(x.stock)<10).length+'</strong></div></div>')}catch(e){shell('OVERVIEW','Dashboard','<section class="admin-panel"><h2>Data unavailable</h2><p>Supabase connection failed. Check project settings and RLS policies.</p></section>')}}
async function products(){try{const p=await get('products?select=*&order=created_at.desc');shell('CATALOG','Products','<section class="admin-panel"><div class="panel-head"><h2>All products</h2><input id="q" placeholder="Search products"></div><table><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows">'+p.map((x,i)=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.sku)+'</td><td>₹'+Number(x.price).toLocaleString('en-IN')+'</td><td>'+x.stock+'</td><td>'+esc(x.status)+'</td><td><button data-edit="'+i+'">Edit</button> <button data-toggle="'+i+'">'+(x.status==='disabled'?'Enable':'Disable')+'</button> <button data-delete="'+i+'">Delete</button></td></tr>').join('')+'</tbody></table></section>');const render=()=>rows.querySelectorAll('tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q.value.toLowerCase()));q.oninput=render;rows.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const x=p[b.dataset.toggle];await get('products?sku=eq.'+encodeURIComponent(x.sku),{method:'PATCH',body:JSON.stringify({status:x.status==='disabled'?'active':'disabled'})});products()});rows.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const x=p[b.dataset.delete];if(confirm('Delete '+x.name+'?')){await get('products?sku=eq.'+encodeURIComponent(x.sku),{method:'DELETE'});products()}})}catch(e){shell('CATALOG','Products','<section class="admin-panel"><h2>Unable to load products</h2><p>'+esc(e.message)+'</p></section>')}}
async function orders(){try{const o=await get('orders?select=*&order=created_at.desc');shell('FULFILMENT','Orders','<section class="admin-panel"><h2>Live orders</h2><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>'+o.map(x=>'<tr><td>'+esc(x.order_number||x.orderNumber||x.id)+'</td><td>'+esc(x.shipping_address?.name||x.customer?.name||'Guest')+'</td><td>₹'+Number(x.total||0).toLocaleString('en-IN')+'</td><td>'+esc(x.status)+'</td></tr>').join('')+'</tbody></table></section>')}catch(e){shell('FULFILMENT','Orders','<section class="admin-panel"><h2>Unable to load orders</h2><p>'+esc(e.message)+'</p></section>')}}
function route(v){document.querySelectorAll('.admin-nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));v==='products'?products():v==='orders'?orders():dashboard()}document.querySelectorAll('.admin-nav').forEach(x=>x.onclick=()=>{location.hash=x.dataset.view;route(x.dataset.view)});route(location.hash.slice(1)||'dashboard');
</script></body></html>

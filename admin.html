<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vastra Admin</title><link rel="stylesheet" href="styles.css"></head><body><div class="admin-shell"><aside class="admin-side"><a class="brand" href="/"><span>V</span>ASTRA</a><p class="eyebrow">CONTROL CENTRE</p><button class="admin-nav active" data-view="dashboard">Dashboard</button><button class="admin-nav" data-view="products">Products</button><button class="admin-nav" data-view="orders">Orders</button><button class="admin-nav" data-view="customers">Customers</button><button class="admin-nav" data-view="coupons">Coupons</button><button class="admin-nav" data-view="reviews">Reviews</button><a href="/">← View storefront</a></aside><main class="admin-main" id="adminContent"></main></div><script>
const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let products=[];async function api(path){return (await fetch(path)).json()}function showForm(type){const title=type==='coupon'?'Create coupon':'Add product';document.querySelector('#adminContent').insertAdjacentHTML('afterbegin','<section class="admin-panel inline-form"><div class="panel-head"><h2>'+title+'</h2><button class="close-form">×</button></div><form id="dataForm">'+(type==='coupon'?'<label>Coupon code<input required placeholder="FESTIVE10"></label><label>Discount value<input required type="number" placeholder="10"></label><label>Minimum order value<input required type="number" placeholder="2000"></label>':'<label>Product name<input required placeholder="Product name"></label><label>SKU<input required placeholder="SKU-001"></label><label>Price<input required type="number" placeholder="1299"></label><label>Stock<input required type="number" placeholder="10"></label>')+'<button class="btn btn-dark">Save '+type+'</button><span class="form-msg"></span></form></section>');document.querySelector('.close-form').onclick=()=>document.querySelector('.inline-form').remove();document.querySelector('#dataForm').onsubmit=e=>{e.preventDefault();document.querySelector('.form-msg').textContent='Saved locally. Connect the POST API to persist this record.'}}function shell(title,kicker,body){document.querySelector('#adminContent').innerHTML='<div class="admin-top"><div><p class="eyebrow">'+kicker+'</p><h1>'+title+'</h1></div><button class="btn btn-dark" id="topAction">＋ Add product</button></div>'+body;document.querySelector('#topAction')?.addEventListener('click',()=>showForm('product'))}async function dashboard(){const m=await api('/api/admin/metrics');shell('Good morning, Vastra.','MONDAY · 18 SEPTEMBER 2026','<div class="metrics">'+[['Today\'s sales','₹'+(m.sales||0).toLocaleString('en-IN')],['Orders',m.orders],['Products',m.products],['Low stock',m.lowStock]].map(x=>'<div class="metric"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div><section class="admin-panel"><h2>Store operations</h2><p class="muted">Manage catalog, fulfilment and customer experience from the sidebar.</p></section>')}async function productsView(){products=await api('/api/products');shell('Products','CATALOG','<section class="admin-panel"><div class="panel-head"><h2>All products</h2><input id="adminSearch" placeholder="Search products"></div><table><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead><tbody id="productRows"></tbody></table></section>');const render=()=>{const q=(document.querySelector('#adminSearch').value||'').toLowerCase();document.querySelector('#productRows').innerHTML=products.filter(x=>(x.name+x.sku+x.category).toLowerCase().includes(q)).map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.sku)+'</td><td>'+esc(x.category)+'</td><td>₹'+x.price.toLocaleString('en-IN')+'</td><td>'+x.stock+'</td><td><span class="status">Active</span></td></tr>').join('')};document.querySelector('#adminSearch').oninput=render;render()}function generic(v){const d={orders:['Orders','FULFILMENT','No orders yet. Orders placed through checkout will appear here.'],customers:['Customers','CUSTOMER CARE','Customer accounts will appear here after authentication is connected.'],coupons:['Coupons','PROMOTIONS','Manage discount codes, minimum order values and expiry dates.'],reviews:['Reviews','CUSTOMER VOICE','Product reviews will appear here for moderation.']}[v];shell(d[0],d[1],'<section class="admin-panel"><div class="empty">'+d[2]+'</div><button class="btn btn-dark" id="emptyAction">Create '+d[0].slice(0,-1)+' <span>→</span></button></section>');document.querySelector('#emptyAction').onclick=()=>showForm(v==='coupons'?'coupon':'product')}function route(v){document.querySelectorAll('.admin-nav').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='dashboard')dashboard();else if(v==='products')productsView();else generic(v)}document.querySelectorAll('.admin-nav').forEach(b=>b.onclick=()=>{history.replaceState(null,'','#'+b.dataset.view);route(b.dataset.view)});route(location.hash.slice(1)||'dashboard');
</script></body></html>

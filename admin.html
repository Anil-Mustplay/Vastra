<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vastra Admin</title><link rel="stylesheet" href="styles.css"></head><body><div class="admin-shell"><aside class="admin-side"><a class="brand" href="/">VASTRA</a><p class="eyebrow">CONTROL CENTRE</p><button class="admin-nav" data-view="dashboard">Dashboard</button><button class="admin-nav" data-view="products">Products</button><button class="admin-nav" data-view="orders">Orders</button><a href="/">← View storefront</a></aside><main class="admin-main" id="adminContent"></main></div><script>
const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let products=[];const api=p=>fetch(p).then(r=>r.json());function shell(t,k,b){adminContent.innerHTML='<div class="admin-top"><div><p class="eyebrow">'+k+'</p><h1>'+t+'</h1></div></div>'+b}async function dashboard(){const m=await api('/api/admin/metrics');shell('Dashboard','OVERVIEW','<div class="metrics">'+[['Orders',m.orders],['Products',m.products],['Sales','₹'+m.sales.toLocaleString('en-IN')],['Low stock',m.lowStock]].map(x=>'<div class="metric"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div>')}function editor(p){shell('Edit product','CATALOG · PRODUCT EDITOR','<section class="admin-panel"><form id="editForm" class="edit-form"><label>Product name<input name="name" required value="'+esc(p.name)+'"></label><label>SKU<input name="sku" value="'+esc(p.sku)+'" readonly></label><label>Category<input name="category" value="'+esc(p.category||'')+'"></label><label>Price<input name="price" required type="number" value="'+p.price+'"></label><label>Stock<input name="stock" required type="number" value="'+p.stock+'"></label><label>Status<select name="status"><option value="active" '+(p.status!=='disabled'?'selected':'')+'>Visible / Active</option><option value="disabled" '+(p.status==='disabled'?'selected':'')+'>Disabled / Hidden</option></select></label><label>Description<textarea name="description">'+esc(p.description||'')+'</textarea></label><label>Image URL<input name="imageUrl" value="'+esc(p.imageUrl||'')+'"></label><div><button type="button" id="cancelEdit">Cancel</button> <button class="btn btn-dark">Save changes</button><span id="msg"></span></div></form></section>');cancelEdit.onclick=()=>productsView();editForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(f);delete data.sku;data.price=Number(data.price);data.stock=Number(data.stock);const r=await fetch('/api/products/'+encodeURIComponent(p.sku),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});msg.textContent=r.ok?' Saved successfully':' Save failed';if(r.ok)setTimeout(productsView,500)}}async function productsView(){products=await api('/api/products');shell('Products','CATALOG','<section class="admin-panel"><div class="panel-head"><h2>All products</h2><input id="q" placeholder="Search products"></div><table><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section>');function render(){const q=document.querySelector('#q').value.toLowerCase();rows.innerHTML=products.filter(p=>(p.name+p.sku).toLowerCase().includes(q)).map((p,i)=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.sku)+'</td><td>₹'+p.price.toLocaleString('en-IN')+'</td><td>'+p.stock+'</td><td><span class="status">'+(p.status==='disabled'?'Disabled':'Active')+'</span></td><td><button data-edit="'+i+'">Edit</button> <button data-toggle="'+i+'">'+(p.status==='disabled'?'Enable':'Disable')+'</button> <button data-delete="'+i+'">Delete</button></td></tr>').join('');rows.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editor(products[b.dataset.edit]));rows.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const p=products[b.dataset.toggle];await fetch('/api/products/'+p.sku,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:p.status==='disabled'?'active':'disabled'})});products=await api('/api/products');render()});rows.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const p=products[b.dataset.delete];if(confirm('Delete '+p.name+'?')){await fetch('/api/products/'+p.sku,{method:'DELETE'});products=await api('/api/products');render()}})}q.oninput=render;render()}async function ordersView(){const o=await api('/api/orders');shell('Orders','FULFILMENT','<section class="admin-panel"><h2>Live orders</h2><table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr>'+o.map(x=>'<tr><td>'+x.orderNumber+'</td><td>'+esc(x.customer?.name||'Guest')+'</td><td>₹'+x.total.toLocaleString('en-IN')+'</td><td>'+x.status+'</td></tr>').join('')+'</table></section>')}function route(v){document.querySelectorAll('.admin-nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));if(v==='products')productsView();else if(v==='orders')ordersView();else dashboard()}document.querySelectorAll('.admin-nav').forEach(x=>x.onclick=()=>{location.hash=x.dataset.view;route(x.dataset.view)});route(location.hash.slice(1)||'dashboard');setInterval(()=>{if(location.hash==='#orders')ordersView()},3000);
</script></body></html>

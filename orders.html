<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | Vastra</title><link rel="stylesheet" href="styles.css"></head><body class="profile-page"><header class="site-header"><a class="brand" href="/">VASTRA</a><a class="text-link" href="/#shop">Continue shopping</a></header><main class="orders-page"><p class="eyebrow">ACCOUNT</p><h1>My Orders</h1><p class="orders-note">Orders placed from your Vastra account appear here.</p><section id="ordersList"></section></main><script>const profile=JSON.parse(localStorage.getItem('vastra_profile')||'{}'),email=profile.email||localStorage.getItem('vastra_login_identifier')||'';fetch('/api/orders').then(r=>r.json()).then(rows=>{const mine=rows.filter(o=>!email||o.customer?.email===email);ordersList.innerHTML=mine.length?mine.reverse().map(o=>'<article class="order-card"><div><b>'+o.orderNumber+'</b><small>'+new Date(o.createdAt).toLocaleString()+'</small></div><span class="status">'+o.status+'</span><strong>₹'+Number(o.total).toLocaleString('en-IN')+'</strong><p>'+o.items.map(x=>x.name+' × '+x.quantity).join(', ')+'</p></article>').join(''):'<div class="empty">No orders yet.<br><a href="/#shop">Start shopping →</a></div>'})</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vastra Account</title><link rel="stylesheet" href="styles.css"></head><body class="profile-page"><header class="site-header"><a class="brand" href="/">VASTRA</a><a class="text-link" href="/profile">← Profile</a></header><main class="account-page"><aside class="profile-sidebar"><p class="eyebrow">CREDITS</p><a href="/account.html?section=coupons">Coupons</a><a href="/account.html?section=credit">Vastra Credit</a><a href="/account.html?section=cards">Saved Cards</a><a href="/account.html?section=addresses">Saved Addresses</a></aside><section class="profile-details" id="accountContent"></section></main><script>const section=new URLSearchParams(location.search).get('section')||'coupons',titles={coupons:['Coupons','Save and manage your Vastra discount codes.'],credit:['Vastra Credit','Your Vastra credit balance and transactions.'],cards:['Saved Cards','Securely manage saved payment cards.'],addresses:['Saved Addresses','Add and manage your delivery addresses.']},d=titles[section]||titles.coupons;accountContent.innerHTML='<h1>'+d[0]+'</h1><p>'+d[1]+'</p><div class="account-empty">No '+d[0].toLowerCase()+' added yet.</div><button class="btn btn-dark" id="accountAction">Add '+d[0].replace('Vastra ','')+'</button>';accountAction.onclick=()=>accountContent.querySelector('.account-empty').textContent=section==='credit'?'Your Vastra Credit balance is ₹0.00.':'Add '+d[0].replace('Vastra ','')+' details here.';</script></body></html>
